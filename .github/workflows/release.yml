name: Release candidate (manual, unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build unsigned Windows evaluation package
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify project is ready
        shell: pwsh
        run: |
          if (!(Test-Path 'VolumeAnchor.slnx')) {
            throw 'VolumeAnchor.slnx does not exist.'
          }

          if (!(Test-Path 'src/VolumeAnchor.Agent/VolumeAnchor.Agent.csproj')) {
            throw 'The executable agent project does not exist.'
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore locked dependencies
        run: dotnet restore VolumeAnchor.slnx --locked-mode

      - name: Run tests
        run: dotnet test VolumeAnchor.slnx --configuration Release --no-restore

      - name: Publish executable
        shell: pwsh
        run: |
          dotnet publish 'src/VolumeAnchor.Agent/VolumeAnchor.Agent.csproj' `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:RestoreLockedMode=true `
            -p:PublishSingleFile=true `
            --output "$env:RUNNER_TEMP/volume-anchor-publish"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create archive and checksum
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'volume-anchor-publish'
          $archive = Join-Path $env:RUNNER_TEMP 'volume-anchor-win-x64-UNSIGNED.zip'
          $checksumFile = Join-Path $env:RUNNER_TEMP 'volume-anchor-win-x64-UNSIGNED.sha256'

          if (!(Test-Path -LiteralPath $publishDir -PathType Container)) {
            throw 'Publish output directory does not exist.'
          }

          if (!(Get-ChildItem -LiteralPath $publishDir -File | Select-Object -First 1)) {
            throw 'Publish output directory contains no files.'
          }

          Compress-Archive -Path "$publishDir/*" -DestinationPath $archive -Force

          $digest = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()

          "$digest  volume-anchor-win-x64-UNSIGNED.zip" |
            Set-Content -Path $checksumFile -Encoding ascii

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: volume-anchor-win-x64-UNSIGNED
          path: |
            ${{ runner.temp }}/volume-anchor-win-x64-UNSIGNED.zip
            ${{ runner.temp }}/volume-anchor-win-x64-UNSIGNED.sha256
          if-no-files-found: error
          retention-days: 7