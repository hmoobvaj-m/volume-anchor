version: 2

updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "chore(deps)"

    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # .NET / NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "chore(deps)"

    groups:
      nuget-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"